<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Setup</title>
<style>
:root{--bg:#1a1f24;--card:#243038;--fg:#e8eef2;--muted:#9aadc0;--acc:#3d9cf0;--err:#e05555;--ok:#3cb371}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);line-height:1.4}
main{max-width:420px;margin:0 auto;padding:1.25rem}
h1{font-size:1.35rem;margin:0 0 .25rem}
p.sub{color:var(--muted);margin:0 0 1.25rem;font-size:.95rem}
label{display:block;margin:.75rem 0 .3rem;font-size:.85rem;color:var(--muted)}
input,select,button{width:100%;padding:.65rem .75rem;border-radius:6px;border:1px solid #3a4a55;background:#1c252c;color:var(--fg);font-size:1rem}
button{background:var(--acc);border:none;font-weight:600;margin-top:1rem;cursor:pointer}
button.secondary{background:#3a4a55}
button:disabled{opacity:.5}
.err{color:var(--err);margin:.5rem 0;font-size:.9rem;display:none}
.ok{color:var(--ok);margin:.5rem 0;font-size:.9rem;display:none}
.row{display:flex;gap:.5rem;align-items:center}
.row select{flex:1}
.hint{font-size:.8rem;color:var(--muted);margin-top:.5rem}
.notice{background:#3a3020;border:1px solid #c9a227;padding:.75rem;border-radius:6px;margin-bottom:1rem;display:none}
</style>
</head>
<body>
<main>
  <h1>Camera Wi-Fi Setup</h1>
  <p class="sub" id="apname">Connect this camera to your network.</p>
  <div class="notice" id="notice"></div>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <div id="adminbox">
    <label for="adminpw">Administrator password (create)</label>
    <input type="password" id="adminpw" autocomplete="new-password" minlength="8">
    <label for="adminpw2">Confirm password</label>
    <input type="password" id="adminpw2" autocomplete="new-password" minlength="8">
  </div>

  <label for="nets">Nearby networks</label>
  <div class="row">
    <select id="nets"><option value="">Scanning…</option></select>
    <button type="button" class="secondary" id="rescan" style="width:auto;margin:0">Rescan</button>
  </div>

  <label for="ssid">SSID (or hidden)</label>
  <input type="text" id="ssid" autocomplete="off" maxlength="32">

  <label for="psk">Wi-Fi password</label>
  <input type="password" id="psk" autocomplete="off">

  <label><input type="checkbox" id="hidden" style="width:auto"> Hidden network</label>
  <label><input type="checkbox" id="opennet" style="width:auto"> Open network (no password)</label>

  <button type="button" id="save">Save and connect</button>
  <p class="hint">After you tap Save, this hotspot will turn off while the camera tests the connection. Manual address: http://192.168.4.1</p>
</main>
<script>
(function(){
  var err=document.getElementById('err'), ok=document.getElementById('ok');
  var notice=document.getElementById('notice');
  function showErr(m){err.style.display='block';ok.style.display='none';err.textContent=m;}
  function showOk(m){ok.style.display='block';err.style.display='none';ok.textContent=m;}
  function csrf(){var m=document.cookie.match(/(?:^|; )csrf=([^;]*)/);return m?decodeURIComponent(m[1]):'';}

  function loadStatus(){
    fetch('/cgi-bin/status').then(function(r){return r.json();}).then(function(j){
      document.getElementById('apname').textContent='Hotspot: '+j.ap_ssid+' — pick your Wi-Fi below.';
      if(j.has_admin){
        document.querySelector('label[for=adminpw]').textContent='Administrator password (required to change Wi-Fi)';
        document.getElementById('adminpw2').style.display='none';
        var l2=document.querySelector('label[for=adminpw2]'); if(l2) l2.style.display='none';
        document.getElementById('adminpw').removeAttribute('minlength');
      }
      if(j.notice){notice.style.display='block';notice.textContent=j.notice;}
      if(j.error){showErr(j.error);}
    }).catch(function(){});
  }

  function scan(){
    var sel=document.getElementById('nets');
    sel.innerHTML='<option value="">Scanning…</option>';
    fetch('/cgi-bin/scan').then(function(r){return r.json();}).then(function(j){
      sel.innerHTML='<option value="">— select —</option>';
      (j.networks||[]).forEach(function(n){
        var o=document.createElement('option');
        o.value=n.ssid;
        var sig=n.signal||'';
        // Strongest first from API; show e.g. "MyNetwork — 92%"
        o.textContent=sig?(n.ssid+' — '+sig):n.ssid;
        sel.appendChild(o);
      });
    }).catch(function(){sel.innerHTML='<option value="">Scan failed</option>';});
  }

  document.getElementById('nets').addEventListener('change',function(){
    if(this.value) document.getElementById('ssid').value=this.value;
  });
  document.getElementById('rescan').addEventListener('click',scan);
  document.getElementById('opennet').addEventListener('change',function(){
    document.getElementById('psk').disabled=this.checked;
  });

  document.getElementById('save').addEventListener('click',function(){
    var adminpw=document.getElementById('adminpw').value;
    var adminpw2=document.getElementById('adminpw2').value;
    var ssid=document.getElementById('ssid').value.trim();
    var psk=document.getElementById('psk').value;
    var hidden=document.getElementById('hidden').checked;
    var opennet=document.getElementById('opennet').checked;
    if(!ssid){showErr('Enter or select an SSID.');return;}
    if(document.getElementById('adminbox').style.display!=='none'){
      if(adminpw.length<8){showErr('Admin password must be at least 8 characters.');return;}
      if(adminpw!==adminpw2){showErr('Passwords do not match.');return;}
    }
    if(!opennet && psk.length>0 && psk.length<8){showErr('Wi-Fi password must be at least 8 characters (WPA).');return;}
    showOk('Saving… hotspot will drop for the connection test.');
    var body={ssid:ssid,psk:opennet?'':psk,hidden:hidden,open:opennet,admin_password:adminpw,csrf:csrf()};
    fetch('/cgi-bin/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok){showErr(x.j.error||'Connect failed');return;}
        showOk(x.j.message||'Connecting… If this page stops loading, join your Wi-Fi and open the camera IP.');
      }).catch(function(){showOk('Hotspot dropped for connect test. Rejoin Camera-… if it returns with an error.');});
  });

  loadStatus(); scan();
  setInterval(loadStatus,5000);
})();
</script>
</body>
</html>
