<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Admin</title>
<style>
:root{--bg:#1a1f24;--fg:#e8eef2;--muted:#9aadc0;--acc:#3d9cf0;--card:#243038;--err:#e05555}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:1.25rem}
h1{font-size:1.4rem}
h2{font-size:1.1rem;margin-top:0}
section{background:var(--card);padding:1rem;border-radius:8px;margin-top:1rem}
label{display:block;color:var(--muted);font-size:.85rem;margin:.5rem 0 .25rem}
input,button{width:100%;padding:.55rem;border-radius:6px;border:1px solid #3a4a55;background:#1c252c;color:var(--fg)}
button{background:var(--acc);border:none;font-weight:600;margin-top:.75rem;cursor:pointer}
button.secondary{background:#3a4a55}
.err{color:var(--err)}
.ok{color:#5dce8a}
.row{display:flex;gap:.5rem}
.row>*{flex:1}
pre{white-space:pre-wrap;font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Camera</h1>
  <p id="who" style="color:var(--muted)">Sign in to manage this device.</p>
  <div id="login">
    <label for="pw">Administrator password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button type="button" id="go">Sign in</button>
    <p class="err" id="err"></p>
  </div>
  <div id="dash" style="display:none">
    <section>
      <h2>Status</h2>
      <pre id="st"></pre>
      <div class="row">
        <button type="button" class="secondary" id="refresh">Refresh</button>
        <button type="button" class="secondary" id="logout">Sign out</button>
      </div>
    </section>
    <section>
      <h2>Change password</h2>
      <label for="oldpw">Current</label>
      <input type="password" id="oldpw" autocomplete="current-password">
      <label for="newpw">New (min 8)</label>
      <input type="password" id="newpw" autocomplete="new-password">
      <button type="button" id="chpw">Update password</button>
      <p id="pwmsg"></p>
    </section>
    <section>
      <h2>Saved Wi-Fi</h2>
      <p style="color:var(--muted);font-size:.9rem">Changing Wi-Fi requires admin auth (also used from fallback portal).</p>
      <label for="ssid">SSID</label>
      <input id="ssid" autocomplete="off">
      <label for="psk">Password</label>
      <input type="password" id="psk" autocomplete="new-password">
      <label><input type="checkbox" id="opennet" style="width:auto"> Open network</label>
      <button type="button" id="savewifi">Save Wi-Fi</button>
      <p id="wifimsg"></p>
    </section>
  </div>
</main>
<script>
(function(){
  function csrf(){var m=document.cookie.match(/(?:^|; )csrf=([^;]*)/);return m?decodeURIComponent(m[1]):'';}
  function jpost(url,body){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({csrf:csrf()},body||{}))})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};});});
  }
  function showDash(){
    document.getElementById('login').style.display='none';
    document.getElementById('dash').style.display='block';
    document.getElementById('who').textContent='Signed in';
    loadStatus();
  }
  function loadStatus(){
    fetch('/cgi-bin/admin_status').then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok){document.getElementById('st').textContent=x.j.error||'auth required';return;}
        document.getElementById('st').textContent=JSON.stringify(x.j,null,2);
        if(x.j.ssid) document.getElementById('ssid').value=x.j.ssid;
      });
  }
  document.getElementById('go').onclick=function(){
    jpost('/cgi-bin/admin_login',{password:document.getElementById('pw').value})
      .then(function(x){
        if(!x.ok){document.getElementById('err').textContent=x.j.error||'Login failed';return;}
        showDash();
      }).catch(function(e){document.getElementById('err').textContent=String(e);});
  };
  document.getElementById('logout').onclick=function(){
    jpost('/cgi-bin/admin_logout',{}).then(function(){location.reload();});
  };
  document.getElementById('refresh').onclick=loadStatus;
  document.getElementById('chpw').onclick=function(){
    var msg=document.getElementById('pwmsg');
    jpost('/cgi-bin/admin_password',{
      old_password:document.getElementById('oldpw').value,
      new_password:document.getElementById('newpw').value
    }).then(function(x){
      msg.className=x.ok?'ok':'err';
      msg.textContent=x.ok?'Password updated':(x.j.error||'failed');
    });
  };
  document.getElementById('opennet').onchange=function(){
    document.getElementById('psk').disabled=this.checked;
  };
  document.getElementById('savewifi').onclick=function(){
    var msg=document.getElementById('wifimsg');
    jpost('/cgi-bin/admin_wifi',{
      ssid:document.getElementById('ssid').value.trim(),
      psk:document.getElementById('psk').value,
      open:document.getElementById('opennet').checked?'true':'false'
    }).then(function(x){
      msg.className=x.ok?'ok':'err';
      msg.textContent=x.ok?(x.j.message||'Saved'):(x.j.error||'failed');
    });
  };
  // Resume session if cookie present
  fetch('/cgi-bin/admin_status').then(function(r){if(r.ok) showDash();});
})();
</script>
</body>
</html>
